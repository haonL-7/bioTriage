name: Daily Update & Deploy

on:
  schedule:
    - cron: "37 18 * * *"  # Every day 18:37 UTC (Beijing 02:37, off-peak to avoid :00/:30 rush)

  workflow_dispatch:
    inputs:
      max_articles:
        description: '最多评估文章数'
        required: false
        default: '50'
        type: string
      build_only:
        description: '仅重建部署（跳过爬取/AI评估/轻频道策展，适合纯UI改动，约1-2分钟）'
        required: false
        default: false
        type: boolean

  # 推送到 main 即触发"仅重建部署"：UI/内容改动立即上线（约 1-2 分钟），
  # 跳过爬取/AI评估/轻频道策展，不必等每日 18:37 UTC 的定时任务。
  push:
    branches: [ main ]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ai-news
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl news
        id: crawl
        if: ${{ !inputs.build_only && github.event_name != 'push' }}
        continue-on-error: true
        run: python scripts/crawler.py
        timeout-minutes: 5

      - name: AI evaluate
        id: evaluate
        if: ${{ !inputs.build_only && github.event_name != 'push' }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '50' }}
        run: python scripts/ai_evaluator.py
        timeout-minutes: 15

      - name: Build site
        id: build
        run: python scripts/build.py
        timeout-minutes: 2

      - name: Build platform digest
        run: python scripts/build_digest.py

      - name: Freshness guard
        run: |
          python - <<'PY'
          import datetime, json, re, sys

          MON = {m: i + 1 for i, m in enumerate(
              ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'])}

          def parse(value):
              s = str(value or '')[:11]
              try:
                  return datetime.date.fromisoformat(s[:10])
              except ValueError:
                  pass
              m = re.match(r'^(\d{4})-(\w{3})-(\d{1,2})', s)
              if m and m.group(2).lower() in MON:
                  try:
                      return datetime.date(int(m.group(1)), MON[m.group(2).lower()], int(m.group(3)))
                  except ValueError:
                      return None
              return None

          with open('data/news.json', encoding='utf-8') as f:
              papers = json.load(f).get('papers', [])
          dated = [d for d in (parse(p.get('pubDate') or p.get('pub_date')) for p in papers) if d]
          if not dated:
              sys.exit('STALE: news.json contains no parseable publication dates')
          newest = max(dated)
          age = (datetime.date.today() - newest).days
          print(f'newest paper: {newest} ({age} days old), papers={len(papers)}')
          if age > 45:
              sys.exit(f'STALE: newest paper is {age} days old; the crawler is not producing new articles')
          PY

      - name: Restore lightweight channel snapshots (build-only / push)
        if: ${{ inputs.build_only || github.event_name == 'push' }}
        run: |
          for ch in computational-genomics metagenomics-informatics structural-bioinformatics systems-biology ml-biology single-cell-omics databases-knowledge-graphs ai-drug-discovery; do
            git checkout HEAD -- "_site/$ch" || true
          done

      - name: Lightweight curation — All channels
        id: curate-all
        if: ${{ !inputs.build_only && github.event_name != 'push' }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          for ch in computational-genomics metagenomics-informatics structural-bioinformatics systems-biology ml-biology single-cell-omics databases-knowledge-graphs ai-drug-discovery; do
            echo "=== $ch ==="
            python ../lightweight/build_channel.py $ch
          done
        timeout-minutes: 60

      - name: Build retrieval corpus
        working-directory: .
        run: python scripts/build_rag_corpus.py

      - name: Commit corpus to main
        if: ${{ github.event_name != 'push' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus ai-news/data ai-news/_site
          if git diff --cached --quiet; then
            echo "corpus unchanged"
          else
            git commit -m "chore(corpus): refresh retrieval corpus [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ai-news/_site
          publish_branch: gh-pages
          commit_message: "auto: update AI news"

      - name: Summary
        if: always()
        run: |
          echo "========================================="
          echo "  Daily Update & Deploy - Summary"
          echo "========================================="
          if [ -f data/stats.json ]; then
            python scripts/print_stats.py
          else
            echo "  WARNING: stats.json not found"
          fi
          echo "  Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "========================================="
