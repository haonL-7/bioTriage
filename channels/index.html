<style>
:root { --bg:#fff; --bg-alt:#f7f8fa; --ink:#16181c; --ink-md:#4a5058; --ink-xlt:#8a9199;
  --border:#e3e6ea; --accent:#1a4d80; --max:820px;
  --serif:Georgia,'Times New Roman',serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
:root[data-theme="dark"] { color-scheme:dark; --bg:#14161a; --bg-alt:#191c21; --ink:#e9e7e2;
  --ink-md:#b8b5ae; --ink-xlt:#6e6b66; --border:#2a2e35; --accent:#9cc6ea; }
* { box-sizing:border-box; margin:0; padding:0; }
html.theme-anim, html.theme-anim * { transition:background-color .45s cubic-bezier(.4,0,.2,1),
  color .45s cubic-bezier(.4,0,.2,1), border-color .45s cubic-bezier(.4,0,.2,1) !important; }
body { font-family:var(--sans); background:var(--bg); color:var(--ink); line-height:1.7; font-size:15px; }
a { color:var(--accent); text-decoration:none; }
.top-bar { display:flex; justify-content:space-between; align-items:center; gap:12px;
  position:sticky; top:0; z-index:100; padding:10px 20px; font-size:13px;
  background:rgba(255,255,255,0.45); -webkit-backdrop-filter:blur(18px) saturate(200%);
  backdrop-filter:blur(18px) saturate(200%); border-bottom:1px solid rgba(0,0,0,.07); }
.top-bar, .top-bar * { color:#16181c !important; }
.mini-logo { font-family:var(--serif); font-size:15px; }
.mini-logo em { font-style:normal; color:#1a4d80; }
.brand-mark { width:24px; height:24px; border-radius:6px; object-fit:cover; vertical-align:-6px; margin-right:8px; }
.nav-link { font-size:12px; color:#16181c; background:transparent; border:1px solid rgba(0,0,0,.18);
  border-radius:999px; padding:4px 10px; font-family:inherit; cursor:pointer; }
.wrap { max-width:var(--max); margin:0 auto; padding:34px 20px 72px; }
h1 { font-family:var(--serif); font-size:27px; font-weight:400; margin-bottom:6px; }
.lede { color:var(--ink-md); font-size:14px; margin-bottom:26px; }
/* ---- 频道卡片：网格 + 毛玻璃 ---- */
#list { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
.ch {
  position:relative; display:flex; flex-direction:column; gap:8px;
  padding:20px 22px 18px; border-radius:14px;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 26px rgba(18,58,99,.06), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
}
.ch:hover { transform:translateY(-2px); background:rgba(255,255,255,.8);
  border-color:rgba(26,77,128,.22);
  box-shadow:0 14px 34px rgba(18,58,99,.12), inset 0 1px 0 rgba(255,255,255,.95); }
.ch-name { font-size:15.5px; font-weight:600; letter-spacing:.01em; }
.ch-name a { color:var(--ink); text-decoration:none; }
.ch-name a:hover { color:#1a4d80; }
.ch-desc { font-size:12.5px; color:var(--ink-xlt); margin-top:4px; line-height:1.6; }
.ch-meta { font-size:11.5px; color:var(--ink-xlt); margin-top:auto; padding-top:10px;
  letter-spacing:.02em; font-variant-numeric:tabular-nums; }
.ch-meta::before { content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
  background:#38b79f; margin-right:7px; vertical-align:1px; }
.ch-meta.is-empty { color:var(--ink-faint, #b6c0cc); font-style:italic; }
.ch-meta.is-empty::before { background:#c3ccd6; }

:root[data-theme="dark"] .ch { background:rgba(30,34,40,.55); border-color:rgba(255,255,255,.08);
  box-shadow:0 8px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05); }
:root[data-theme="dark"] .ch:hover { background:rgba(36,41,48,.72); border-color:rgba(127,227,204,.25); }
:root[data-theme="dark"] .ch-name a { color:var(--ink); }

body::before {
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(58% 46% at 10% 6%, rgba(26,77,128,.07) 0%, rgba(26,77,128,0) 68%),
    radial-gradient(48% 42% at 90% 10%, rgba(127,227,204,.08) 0%, rgba(127,227,204,0) 70%);
}
.foot { font-size:12px; color:var(--ink-xlt); margin-top:26px; }

  <div class="hero-fade" aria-hidden="true"></div>
    <canvas id="sf-bg-canvas"></canvas>
    <canvas id="sf-canvas"></canvas>
    <div class="container">
      <h1 style="color:#fff" data-zh="频道" data-en="Channels">频道</h1>
      <p style="color:rgba(255,255,255,.72)" data-zh="每个频道独立抓取、独立评估，日报与周报再把它们聚合起来。"
         data-en="Each channel is crawled and graded on its own; Daily and Weekly then aggregate them.">每个频道独立抓取、独立评估，日报与周报再把它们聚合起来。</p>

<div class="wrap">
  
  <div id="list"><p class="foot" data-zh="载入中…" data-en="Loading…">载入中…</p></div>

     <a href="../daily/" data-zh="查看今日聚合 →" data-en="See today's digest →">查看今日聚合 →</a></p>
</div>

<script>
(function () {
  var CHANNELS = [
    ['computational-genomics', 'Computational Genomics & Epigenomics', '计算基因组学与表观遗传学',
     'Genomics and epigenetics methods', '基因组学与表观遗传学的计算方法'],
    ['metagenomics-informatics', 'Metagenomics & Microbiome Informatics', '宏基因组与微生物组信息学',
     'Metagenomics and microbiome informatics', '宏基因组、微生物组信息学'],
    ['structural-bioinformatics', 'Structural Bioinformatics & Protein Science', '结构生物信息学与蛋白质科学',
     'Structure prediction, docking, protein design', '结构预测、分子对接、蛋白设计'],
    ['systems-biology', 'Systems Biology & Network Analysis', '系统生物学与网络分析',
     'Network modelling, multi-omics integration', '网络建模、多组学整合、动态系统'],
    ['single-cell-omics', 'Single-Cell & Spatial Omics', '单细胞与空间组学',
     'Single-cell, spatial, trajectory inference', '单细胞转录组、空间组学、轨迹推断'],
    ['ml-biology', 'Machine Learning for Biological Data', '生物数据机器学习',
     'Foundation models for biology', '生物领域的机器学习基础模型'],
    ['databases-knowledge-graphs', 'Biological Databases & Knowledge Graphs', '生物数据库与知识图谱',
     'Biological databases, ontologies, graphs', '生物数据库、本体、知识图谱'],
    ['ai-drug-discovery', 'AI-Driven Drug Discovery', 'AI 驱动的药物发现',
     'Screening, ADMET, molecular generation', '虚拟筛选、ADMET、分子生成'],
    ['scfa/daily', 'Gut Microbiome Co-Metabolism', '肠道微生物组共代谢',
     'Gut microbiome co-metabolism (standalone channel)', '肠道菌群共代谢（独立频道，含 101 篇基线文献）']
  ];

  function lang() { try { return localStorage.getItem('bt-lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; } }
  var L = lang();
  var list = document.getElementById('list');

  function empty(row) {
    row.textContent = (L === 'en' ? 'awaiting first sync' : '待首次同步');
    row.classList.add('is-empty');
  }

  function render() {
    list.innerHTML = CHANNELS.map(function (c) {
      var name = L === 'en' ? c[1] : c[2];
      var desc = L === 'en' ? c[3] : c[4];
      return '<div class="ch" data-key="' + c[0] + '">'
        + '<div><div class="ch-name"><a href="../' + c[0] + '/">' + name + '</a></div>'
        + '<div class="ch-desc">' + desc + '</div></div>'
        + '<div class="ch-meta" data-meta>' + (L === 'en' ? '…' : '…') + '</div></div>';
    }).join('');
    CHANNELS.forEach(function (c) {
      var row = list.querySelector('[data-key="' + c[0] + '"] [data-meta]');
      var path = (c[0] === 'scfa/daily') ? '../evidence/data/news.json' : '../' + c[0] + '/data/papers.json';
      fetch(path)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!row) { return; }
          var arr = (d && (d.papers || d.items)) || [];
          var ds = arr.map(function (p) { return String(p.pub_date || p.pubDate || ''); }).filter(Boolean).sort();
          var last = ds.slice(-1)[0];
          if (!arr.length) { empty(row); return; }
          row.textContent = arr.length + (L === 'en' ? ' papers' : ' 篇') + (last ? ' · ' + last : '');
        })
        .catch(function () { if (row) { empty(row); } });
    });
  }

  function applyText() {
    var nodes = document.querySelectorAll('[data-zh][data-en]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = nodes[i].getAttribute(L === 'en' ? 'data-en' : 'data-zh');
    }
    var lt = document.getElementById('lang-toggle');
    if (lt) { lt.textContent = L === 'en' ? '中文' : 'EN'; }
    document.documentElement.lang = L === 'en' ? 'en' : 'zh-CN';
  }

  render();
  applyText();

  var lt = document.getElementById('lang-toggle');
  if (lt) {
    lt.addEventListener('click', function () {
      L = (L === 'en') ? 'zh' : 'en';
      try { localStorage.setItem('bt-lang', L); } catch (e) {}
      applyText();
      render();
    });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('#theme-toggle') : null;
    if (!b) { return; }
    var order = ['light', 'dark', 'auto'];
    var cur = (function () { try { var v = localStorage.getItem('bt-theme'); return (v === 'dark' || v === 'light') ? v : 'auto'; } catch (err) { return 'auto'; } })();
    var next = order[(order.indexOf(cur) + 1) % order.length];
    try { if (next === 'auto') { localStorage.removeItem('bt-theme'); } else { localStorage.setItem('bt-theme', next); } } catch (err) {}
    var root = document.documentElement;
    root.classList.add('theme-anim');
    setTimeout(function () { root.classList.remove('theme-anim'); }, 620);
    root.dataset.theme = (next === 'auto')
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light') : next;
  });
})();
</script>
